name: Wanderkarte veröffentlichen
on:
  push:
    branches: [main]
    paths:
      - "gpx/**"
      - "build.py"
      - "precompute_surfaces.cjs"
      - "template.html"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - name: Gespeicherte Wegdaten wiederverwenden
        uses: actions/cache@v4
        with:
          path: surface-cache
          key: osm-surfaces-${{ hashFiles('gpx/**') }}
          restore-keys: |
            osm-surfaces-
      - name: Wegarten vorab berechnen (OpenStreetMap)
        run: node precompute_surfaces.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
