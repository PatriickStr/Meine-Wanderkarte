<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Meine Wanderkarte – Wegbeschaffenheit</title><!-- WEGARTEN-KORRIDOR-V2; MapLibre-only; keine maplibregl.supported() -->
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>:root{--bg:#081411;--panel:#0c1d17;--card:#162b22;--mint:#a4f0b2;--line:#355344;--muted:#a4b8ab}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1f7f1;font:14px/1.45 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}#mapScreen{position:fixed;inset:0;display:block}#map{position:absolute;inset:0;background:#12251d}.screen{display:none;position:fixed;inset:0;overflow:auto;background:var(--bg);padding:85px 18px 110px}.screen.active{display:block}#mapScreen:not(.active){display:none}.topbar{position:absolute;top:0;left:0;right:0;z-index:3;padding:calc(14px + env(safe-area-inset-top)) 16px 20px;display:flex;align-items:center;gap:12px;background:linear-gradient(#07120ff5,#07120f00)}.brand{font-size:18px;font-weight:750;flex:1}.round{border:1px solid #ffffff38;border-radius:50%;background:#0b1b16dd;width:43px;height:43px;font-size:18px;backdrop-filter:blur(12px)}.tools{position:absolute;right:15px;top:120px;z-index:3;display:grid;gap:10px}.tools button{width:46px;height:46px}.selected{background:#315b42!important;color:var(--mint)!important;border-color:var(--mint)!important}.mapstats{position:absolute;bottom:calc(93px + env(safe-area-inset-bottom));left:12px;right:12px;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;pointer-events:none}.glass{border:1px solid #ffffff32;background:#071512df;border-radius:14px;padding:10px;backdrop-filter:blur(12px)}.glass strong{display:block;font-size:18px}.glass small{color:#bdc8be;font-size:11px}.nav{position:fixed;bottom:0;left:0;right:0;height:calc(74px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);z-index:20;background:#071512f5;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #ffffff26;backdrop-filter:blur(18px)}.nav button{border:0;background:transparent;color:#a5b7ac;min-width:75px;display:grid;justify-items:center;gap:2px}.nav button span{font-size:23px}.nav button.active{color:var(--min --muted)}.actions{display:flex;gap:8px}.actions button{flex:1;padding:11px 8px;background:#244c34;border:1px solid #548368;border-radius:11px}.notice{position:fixed;top:85px;left:15px;right:70px;z-index:9;background:#142a20;border:1px solid #8acda0;padding:12px;border-radius:12px;display:none}.maplibregl-ctrl-attrib{font-size:9px!important}@media(min-width:800px){#popup{width:440px;right:auto;left:20px}.mapstats{right:auto;width:470px;left:20px}.screen{padding-left:max(12%,calc((100% - 850px)/2));padding-right:max(12%,calc((100% - 850px)/2))}.nav{width:440px;left:50%;transform:translateX(-50%);border-radius:17px 17px 0 0}}
/* OSM-Wegarten */
.surface-legend{display:flex;flex-wrap:wrap;gap:7px 12px;margin:10px 0;color:#dce9dd;font-size:12px}
.surface-legend span{display:inline-flex;align-items:center;gap:5px}.surface-dot{width:10px;height:10px;display:inline-block;border-radius:3px}

</style></head><body>
<section id="mapScreen" class="active"><div id="map"></div><header class="topbar"><span style="color:var(--mint);font-size:24px">⌁</span><span class="brand">Meine Wanderkarte</span><button class="round" id="find" aria-label="Touren suchen">⌕</button></header><div class="tools"><button class="round" id="north" title="Nach Norden ausrichten">▲</button><button class="round" id="terrain" title="3D-Gelände">3D</button><button class="round" id="base" title="Kartenansicht">▱</button><button class="round" id="heat" title="Heatmap">♨</button><button class="round" id="fit" title="Alle Touren anzeigen">⌖</button></div><div class="mapstats"><div class="glass"><strong id="mTours"></strong><small>Touren</small></div><div class="glass"><strong id="mKm"></strong><small>Distanz</small></div><div class="glass"><strong id="mGain"></strong><small>Aufstieg (ca.)</small></div></div></section>
<section id="toursScreen" class="screen"><h1>Touren</h1><p class="sub" id="count"></p><input id="search" class="search" placeholder="Tour suchen …"><select id="sort"><option value="name">Name A–Z</option><option value="distance">Längste zuerst</option><option value="gain">Meiste Höhenmeter</option></select><div id="tourList"></div></section>
<section id="statsScreen" class="screen"><h1>Deine Statistik</h1><p class="sub">Deine Wanderwelt in Zahlen</p><div class="statsgrid"><div class="stat"><strong id="sTours"></strong><small>GPX-Touren</small></div><div class="stat"><strong id="sKm"></strong><small>Gesamtdistanz</small></div><div class="stat"><strong id="sGain"></strong><small>Aufstieg (ca.)</small></div><div class="stat"><strong id="sAvg"></strong><small>Ø Tourlänge</small></div></div><h2>Rekorde</h2><div id="records"></div><p class="hint">Die Daten stammen aus deinen GPX-Dateien. Aufstieg ist geschätzt; Wegbeschaffenheit und Gehzeit sind nicht enthalten.</p></section>
<div id="popup" role="dialog" aria-label="Tourinformationen"></div><div id="notice" class="notice"></div><nav class="nav"><button class="active" data-tab="map"><span>▱</span>Karte</button><button data-tab="tours"><span>△</span>Touren</button><button data-tab="stats"><span>▥</span>Statistik</button></nav>
<script>
'use strict';
const DATA=__ROUTE_DATA__,routes=DATA.routes||[], $=id=>document.getElementById(id);
const fmt=(v,d=1)=>Number(v||0).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const hav=(a,b)=>{const p=Math.PI/180,x=Math.sin((b[0]-a[0])*p/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin((b[1]-a[1])*p/2)**2;return 12742*Math.asin(Math.min(1,Math.sqrt(x)))};
const sumKm=routes.reduce((a,r)=>a+r.km,0),sumGain=routes.reduce((a,r)=>a+(r.gain||0),0);
$('mTours').textContent=$('sTours').textContent=routes.length;$('mKm').textContent=$('sKm').textContent=fmt(sumKm)+' km';$('mGain').textContent=$('sGain').textContent=fmt(sumGain,0)+' m';$('sAvg').textContent=fmt(routes.length?sumKm/routes.length:0)+' km';$('count').textContent=routes.length+' GPX-Wanderungen entdecken';
if(routes.length){const longest=routes.reduce((a,b)=>a.km>=b.km?a:b),highest=routes.filter(r=>r.hasElevation).sort((a,b)=>(b.gain||0)-(a.gain||0))[0];const rec=(label,r,value)=>{const div=document.createElement('div');div.className='stat';div.style.marginTop='10px';const small=document.createElement('small'),strong=document.createElement('strong');small.textContent=label;strong.textContent=r.name;strong.style.fontSize='16px';div.append(small,strong,document.createTextNode(value));$('records').append(div)};rec('Längste Tour',longest,fmt(longest.km)+' km');if(highest)rec('Meiste Höhenmeter',highest,fmt(highest.gain,0)+' m')}
function tab(name){for(const n of ['map','tours','stats'])$(n+'Screen').classList.toggle('active',n===name);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));if(name==='map'&&map)setTimeout(()=>map.resize(),60)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));
function renderList(){const q=$('search').value.toLocaleLowerCase('de'),order=$('sort').value,arr=routes.map((r,i)=>({r,i})).filter(o=>o.r.name.toLocaleLowerCase('de').includes(q));arr.sort((a,b)=>order==='distance'?b.r.km-a.r.km:order==='gain'?(b.r.gain||0)-(a.r.gain||0):a.r.name.localeCompare(b.r.name,'de'));$('tourList').replaceChildren();for(const {r,i} of arr){const b=document.createElement('button');b.className='tour';const num=document.createElement('span');num.className='number';num.textContent=String(i+1).padStart(2,'0');const name=document.createElement('span');name.className='name';const title=document.createElement('strong'),sub=document.createElement('small');title.textContent=r.name;sub.textContent=fmt(r.km)+' km · '+(r.hasElevation?'↑ ca. '+fmt(r.gain,0)+' m':'keine Höhendaten');name.append(title,sub);b.append(num,name,document.createTextNode('›'));b.addEventListener('click',()=>openTour(i));$('tourList').append(b)}if(!arr.length)$('tourList').textContent='Keine passende Tour gefunden.'}
$('search').addEventListener('input',renderList);$('sort').addEventListener('change',renderList);$('find').onclick=()=>{tab('tours');$('search').focus()};renderList();
const sourceGeo={type:'FeatureCollection',features:routes.flatMap((r,i)=>r.segments.filter(s=>s.length>1).map(s=>({type:'Feature',properties:{index:i},geometry:{type:'LineString',coordinates:s.map(p=>[p[1],p[0]])}})))};
const heatGeo={type:'FeatureCollection',features:(DATA.heatlines||[]).map(([level,pts])=>({type:'Feature',properties:{level},geometry:{type:'LineString',coordinates:pts.map(p=>[p[1],p[0]])}}))};
const emptyGeo={type:'FeatureCollection',features:[]};
const tiles={satellite:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'© Esri'},street:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'},terrainDem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,maxzoom:15,encoding:'terrarium',attribution:'© Mapzen / AWS'}};
function style(){return {version:8,sources:tiles,layers:[{id:'satellite-base',type:'raster',source:'satellite'},{id:'street-base',type:'raster',source:'street',layout:{visibility:'none'}}]}};
let map=null,ready=false,chosen=-1,terrainOn=false,streetOn=false,heatOn=false,marker=null,chart=null,profile=[],profileIndex=0;
const allCoords=sourceGeo.features.flatMap(f=>f.geometry.coordinates),bounds=allCoords.length?allCoords.reduce((b,p)=>[[Math.min(b[0][0],p[0]),Math.min(b[0][1],p[1])],[Math.max(b[1][0],p[0]),Math.max(b[1][1],p[1])]],[allCoords[0],allCoords[0]]):[[7.8,51],[9,52]];
function note(msg){$('notice').textContent=msg;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',5500)}
function geo(i){return {type:'FeatureCollection',features:sourceGeo.features.filter(f=>f.properties.index===i)}}
function addLayers(){map.addSource('routes',{type:'geojson',data:sourceGeo});map.addSource('chosen',{type:'geojson',data:emptyGeo});map.addSource('heat',{type:'geojson',data:heatGeo});map.addSource('surface-selection',{type:'geojson',data:emptyGeo});map.addLayer({id:'tracks-shadow',type:'line',source:'routes',paint:{'line-color':'#081511','line-width':4,'line-opacity':.8}});map.addLayer({id:'tracks',type:'line',source:'routes',paint:{'line-color':'#ff4d4d','line-width':2.4}});map.addLayer({id:'heatlines',type:'line',source:'heat',layout:{visibility:'none'},paint:{'line-color':['match',['get','level'],4,'#fc454c',3,'#ff6747',2,'#ffa63c','#e4e86d'],'line-width':3.3,'line-opacity':.9}});map.addLayer({id:'selected-shadow',type:'line',source:'chosen',paint:{'line-color':'#06130c','line-width':7}});map.addLayer({id:'selected-line',type:'line',source:'chosen',paint:{'line-color':'#a4f0b2','line-width':4}});map.addLayer({id:'surface-shadow',type:'line',source:'surface-selection',layout:{visibility:'none'},paint:{'line-color':'#081411','line-width':8,'line-opacity':.95}});map.addLayer({id:'surface-colored',type:'line',source:'surface-selection',layout:{visibility:'none'},paint:{'line-color':['match',['get','kind'],'trail','#57d88e','gravel','#f4b154','paved','#5ab8ff','other','#c49fff','#9eafb0'],'line-width':5,'line-opacity':1}});map.addLayer({id:'route-hitbox',type:'line',source:'routes',paint:{'line-color':'#ff4d4d','line-opacity':0,'line-width':24}});map.on('click','route-hitbox',e=>{const f=e.features&&e.features[0];if(f)openTour(Number(f.properties.index))});map.on('mouseenter','route-hitbox',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','route-hitbox',()=>map.getCanvas().style.cursor='');ready=true;if(chosen>=0)selectLine(chosen);refreshSurfaceMap()}
function initMap(){console.info('KARTENFIX-2026-11-17-V2 aktiv');if(!window.maplibregl){note('MapLibre konnte nicht geladen werden. Bitte Internetverbindung prüfen.');return}try{map=new maplibregl.Map({container:'map',style:style(),center:[8.4,51.3],zoom:8,pitch:0,bearing:0,maxPitch:85,attributionControl:false});map.addControl(new maplibregl.AttributionControl({compact:true}));map.dragRotate.enable();map.touchZoomRotate.enableRotation();map.on('load',()=>{addLayers();map.fitBounds(bounds,{padding:50,maxZoom:13,duration:0})});map.on('error',e=>{if(e.error)console.warn('Kartenfehler:',e.error.message)});map.on('rotate',()=>$('north').style.transform='rotate('+(-map.getBearing())+'deg)')}catch(e){note('Karte konnte nicht gestartet werden: '+e.message)}}
function selectLine(i){chosen=i;if(map&&ready)map.getSource('chosen').setData(geo(i));refreshSurfaceMap()}
function fitTour(i){if(!map||!ready)return;const c=routes[i].segments.flat().map(p=>[p[1],p[0]]);if(!c.length)return;const b=c.reduce((a,p)=>[[Math.min(a[0][0],p[0]),Math.min(a[0][1],p[1])],[Math.max(a[1][0],p[0]),Math.max(a[1][1],p[1])]],[c[0],c[0]]);map.fitBounds(b,{padding:{top:80,bottom:Math.min(window.innerHeight*.54,390),left:30,right:30},maxZoom:14,duration:650})}
$('north').onclick=()=>map&&map.easeTo({bearing:0,duration:450});$('fit').onclick=()=>map&&map.fitBounds(bounds,{padding:55,duration:650});$('base').onclick=()=>{streetOn=!streetOn;if(ready){map.setLayoutProperty('street-base','visibility',streetOn?'visible':'none');map.setLayoutProperty('satellite-base','visibility',streetOn?'none':'visible')}$('base').classList.toggle('selected',streetOn)};
$('heat').onclick=()=>{heatOn=!heatOn;if(ready)map.setLayoutProperty('heatlines','visibility',heatOn?'visible':'none');$('heat').classList.toggle('selected',heatOn)};
$('terrain').onclick=()=>{if(!map||!ready)return;terrainOn=!terrainOn;try{if(terrainOn){map.setTerrain({source:'terrainDem',exaggeration:1.35});map.easeTo({pitch:65,duration:600})}else{map.setTerrain(null);map.easeTo({pitch:0,duration:600})}$('terrain').classList.toggle('selected',terrainOn)}catch(e){terrainOn=false;$('terrain').classList.remove('selected');note('3D-Gelände konnte nicht aktiviert werden.')}};
function closePopup(){surfaceRequestId++;surfaceShown=false;if(chart){chart.destroy();chart=null}if(marker){marker.remove();marker=null}profile=[];$('popup').classList.remove('open');selectLine(-1)}
function profileData(r){let distance=0,out=[];for(const seg of r.segments){let prev=null;for(const p of seg){if(prev)distance+=hav(prev,p);if(p[2]!==null&&Number.isFinite(p[2]))out.push({x:distance,y:p[2],pos:[p[1],p[0]]});prev=p}}return out}
function moveMarker(index){if(!profile.length)return;profileIndex=Math.max(0,Math.min(profile.length-1,Math.round(index)));const p=profile[profileIndex];$('slider').value=String(Math.round(profileIndex/Math.max(1,profile.length-1)*1000));$('position').textContent=fmt(p.x)+' km · '+fmt(p.y,0)+' m';if(map){if(!marker){const el=document.createElement('div');el.style.cssText='height:18px;width:18px;border:3px solid white;border-radius:50%;background:#a4f0b2;box-shadow:0 0 0 5px #a4f0b244,0 2px 10px #0009';marker=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(p.pos).addTo(map)}else marker.setLngLat(p.pos)}if(chart)chart.draw()}
const cursorPlugin={id:'profileCursor',afterDatasetsDraw(c){if(!profile.length)return;const p=profile[profileIndex],x=c.scales.x.getPixelForValue(p.x),a=c.chartArea,ctx=c.ctx;ctx.save();ctx.strokeStyle='#e7fff0';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(x,a.top);ctx.lineTo(x,a.bottom);ctx.stroke();ctx.restore()}};
function renderProfile(r){profile=profileData(r);if(profile.length<2){$('profileBox').textContent='Für diese Route sind keine ausreichenden Höhendaten vorhanden.';$('slider').disabled=true;return}$('slider').disabled=false;const sample=profile.filter((p,i)=>i%Math.max(1,Math.ceil(profile.length/450))===0||i===profile.length-1);chart=new Chart($('profileCanvas'),{type:'line',data:{datasets:[{data:sample,parsing:false,borderColor:'#a4f0b2',backgroundColor:'#a4f0b222',fill:true,pointRadius:0,borderWidth:2}]},plugins:[cursorPlugin],options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'nearest',intersect:false},plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{type:'linear',min:0,max:profile[profile.length-1].x,ticks:{color:'#9cb5a4',maxTicksLimit:5},grid:{color:'#2b4435'}},y:{ticks:{color:'#9cb5a4',maxTicksLimit:4},grid:{color:'#2b4435'}}}}});const canvas=$('profileCanvas');const at=x=>{if(!chart)return;const rect=canvas.getBoundingClientRect(),pixel=(x-rect.left)*chart.width/rect.width,a=chart.chartArea,target=chart.scales.x.getValueForPixel(Math.max(a.left,Math.min(a.right,pixel)));let lo=0,hi=profile.length-1;while(lo<hi){const mid=(lo+hi)>>1;if(profile[mid].x<target)lo=mid+1;else hi=mid}if(lo&&Math.abs(profile[lo-1].x-target)<Math.abs(profile[lo].x-target))lo--;moveMarker(lo)};let dragging=false;canvas.onpointerdown=e=>{dragging=true;canvas.setPointerCapture(e.pointerId);at(e.clientX)};canvas.onpointermove=e=>{if(dragging||e.pointerType==='mouse')at(e.clientX)};canvas.onpointerup=canvas.onpointercancel=()=>dragging=false;$('slider').oninput=e=>moveMarker(Number(e.target.value)/1000*(profile.length-1));moveMarker(0)}
function downloadGpx(r){const escape=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;');let xml='<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Meine Wanderkarte" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>'+escape(r.name)+'</name>';for(const seg of r.segments){xml+='<trkseg>';for(const p of seg)xml+='<trkpt lat="'+p[0]+'" lon="'+p[1]+'">'+(p[2]===null?'':'<ele>'+p[2]+'</ele>')+'</trkpt>';xml+='</trkseg>'}xml+='</trk></gpx>';const url=URL.createObjectURL(new Blob([xml],{type:'application/gpx+xml'})),a=document.createElement('a');a.href=url;a.download='wanderung-'+(routes.indexOf(r)+1)+'.gpx';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function openTour(i){if(!Number.isInteger(i)||!routes[i])return;closePopup();tab('map');selectLine(i);const r=routes[i],elev=r.segments.flat().map(p=>p[2]).filter(v=>v!==null&&Number.isFinite(v)),highest=elev.length?fmt(elev.reduce((a,b)=>Math.max(a,b),-Infinity),0)+' m':'–';$('popup').innerHTML='<button id="closePopup" class="close" aria-label="Schließen">×</button><small style="color:var(--mint)">TOUR '+(i+1)+' / '+routes.length+'</small><h2 id="popupTitle"></h2><div class="metrics"><div class="metric"><strong>'+fmt(r.km)+' km</strong><small>Distanz</small></div><div class="metric"><strong>'+(r.hasElevation?fmt(r.gain,0)+' m':'–')+'</strong><small>Aufstieg (ca.)</small></div><div class="metric"><strong>'+highest+'</strong><small>Höchster Punkt</small></div></div><h3 style="margin:15px 0 0">Höhenprofil</h3><div class="chartbox" id="profileBox"><canvas id="profileCanvas"></canvas></div><input class="slider" id="slider" type="range" min="0" max="1000" value="0" aria-label="Position entlang der Route"><div class="value" id="position">–</div><p class="hint">Finger über das Höhenprofil bewegen: Die mintgrüne Markierung folgt der GPS-Strecke. Gehzeit ist nicht in den GPX-Daten hinterlegt. Die Wegarten stammen aus vorberechneten OpenStreetMap-Daten.</p><div id="surfaceArea"><h3 style="margin:15px 0 4px">Wegbeschaffenheit</h3><p class="surface-status" id="surfaceStatus">Wegarten werden entlang der Route geladen …</p></div><div class="actions"><button id="centerTour">Route zentrieren</button><button id="downloadTour">GPX herunterladen</button></div>';$('popupTitle').textContent=r.name;$('popup').classList.add('open');$('closePopup').onclick=closePopup;$('centerTour').onclick=()=>fitTour(i);$('downloadTour').onclick=()=>downloadGpx(r);try{renderProfile(r)}catch(e){console.error('Profil:',e);$('profileBox').textContent='Höhenprofil konnte nicht geladen werden.'}setTimeout(()=>fitTour(i),100);loadSurface(i)}
// --- OSM-Oberflächenabgleich: dynamisch, ohne Änderungen an build.py ---
const SURFACE_COLORS={trail:'#57d88e',gravel:'#f4b154',paved:'#5ab8ff',other:'#c49fff',unknown:'#9eafb0'};
const SURFACE_NAMES={trail:'Trail / Naturweg',gravel:'Schotter / verdichtet',paved:'Asphalt / befestigt',other:'Andere Oberfläche',unknown:'Unbekannt'};
const surfaceCache=new Map();let surfaceShown=false,surfaceRequestId=0;
function classifyWay(t){
 const surface=(t.surface||'').toLowerCase(),hw=t.highway||'',track=t.tracktype||'';
 const natural=['dirt','earth','ground','grass','mud','sand','rock','stone','woodchips','soil','clay','grass_paver','pebblestone'];
 const gravel=['gravel','fine_gravel','compacted','crushed_stone','shells'];
 const paved=['asphalt','concrete','concrete:plates','concrete:lanes','paving_stones','sett','cobblestone','unhewn_cobblestone','paved','metal','wood','bricks','chipseal'];
 if(paved.includes(surface))return {kind:'paved',strong:surface!=='paved',reason:surface};
 if(gravel.includes(surface))return {kind:'gravel',strong:true,reason:surface};
 if(natural.includes(surface))return {kind:'trail',strong:true,reason:surface};
 if(surface==='unpaved')return {kind:'other',strong:true,reason:'unpaved – Material unbekannt'};
 if(surface)return {kind:'other',strong:true,reason:surface};
 // Ein path ist ein Wegtyp, kein Oberflächenbeweis.
 if(hw==='path'||hw==='bridleway')return {kind:'trail',strong:false,reason:'OSM-Wegtyp '+hw};
 if(hw==='track'&&(track==='grade4'||track==='grade5'))return {kind:'trail',strong:false,reason:'OSM '+track};
 if(hw==='track'&&track==='grade2')return {kind:'gravel',strong:false,reason:'OSM '+track};
 return {kind:'unknown',strong:false,reason:'keine Oberflächenangabe'};
}
function makeOsmQuery(r){
 // Nur einen schmalen Streckenkorridor abfragen statt des gesamten Tour-Rechtecks.
 // 65 m Puffer und Wegpunkte etwa alle 70 m: auch kurvige Pfade bleiben im Suchgebiet.
 const points=[];let last=null,acc=0;
 for(const seg of r.segments){
  for(let j=0;j<seg.length;j++){
   const p=seg[j];
   if(!last||j===0||acc>=.07){points.push(p);acc=0}
   if(last)acc+=hav(last,p);
   last=p;
  }
  if(seg.length)points.push(seg[seg.length-1]);
 }
 const coords=points.filter((p,i)=>i===0||p[0]!==points[i-1][0]||p[1]!==points[i-1][1])
   .map(p=>p[0].toFixed(5)+','+p[1].toFixed(5)).join(',');
 return '[out:json][timeout:22];way["highway"~"^(path|footway|track|pedestrian|cycleway|residential|service|living_street|unclassified|tertiary|secondary|primary|steps|bridleway|road)$"](around:65,'+coords+');out geom;';
}
async function getOSMWays(r){
 const query=makeOsmQuery(r);
 const endpoints=['https://overpass.private.coffee/api/interpreter','https://overpass-api.de/api/interpreter'];
 let lastError;
 for(const endpoint of endpoints){
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),25000);
  try{
   const res=await fetch(endpoint,{method:'POST',body:new URLSearchParams({data:query}),signal:controller.signal});
   if(!res.ok)throw Error('OSM-Dienst meldet HTTP '+res.status);
   const data=await res.json();if(!Array.isArray(data.elements))throw Error('Ungültige OSM-Antwort');
   return data.elements.filter(w=>w.type==='way'&&Array.isArray(w.geometry)&&w.geometry.length>1);
  }catch(err){lastError=err;console.warn('Overpass:',endpoint,err.message)}finally{clearTimeout(timeout)}
 }
 throw lastError||Error('OpenStreetMap nicht erreichbar');
}
// Ein räumlicher Index beschleunigt den Abgleich der GPX-Segmente mit OSM-Wegegeometrien.
function matchSurface(r,ways){
 const cell=.0015,idx=new Map(),cos=Math.cos(r.segments[0][0][0]*Math.PI/180);
 const key=(x,y)=>x+','+y;
 for(const w of ways){
  const cl=classifyWay(w.tags||{});
  for(let j=1;j<w.geometry.length;j++){
   const a=w.geometry[j-1],b=w.geometry[j];
   const ax=a.lon*cos,ay=a.lat,bx=b.lon*cos,by=b.lat;
   const seg={ax,ay,bx,by,cl};
   const minx=Math.floor(Math.min(a.lon,b.lon)/cell),maxx=Math.floor(Math.max(a.lon,b.lon)/cell);
   const miny=Math.floor(Math.min(a.lat,b.lat)/cell),maxy=Math.floor(Math.max(a.lat,b.lat)/cell);
   if((maxx-minx+1)*(maxy-miny+1)>400)continue;
   for(let x=minx;x<=maxx;x++)for(let y=miny;y<=maxy;y++){
    const k=key(x,y),bucket=idx.get(k);if(bucket)bucket.push(seg);else idx.set(k,[seg]);
   }
  }
 }
 const output=[],totals={trail:0,gravel:0,paved:0,other:0,unknown:0},strongTotals={trail:0,gravel:0,paved:0,other:0,unknown:0};
 let total=0;
 for(const points of r.segments){
  if(points.length<2)continue;
  let runKind=null,run=[],runStrong=false;
  const flush=()=>{if(run.length>1)output.push({type:'Feature',properties:{kind:runKind,strong:runStrong},geometry:{type:'LineString',coordinates:run}})};
  for(let i=1;i<points.length;i++){
   const a=points[i-1],b=points[i],distance=hav(a,b);
   if(distance<=0)continue;
   const lon=(a[1]+b[1])/2,lat=(a[0]+b[0])/2,px=lon*cos,py=lat;
   const gx=Math.floor(lon/cell),gy=Math.floor(lat/cell);
   const candidates=new Set();
   for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(const seg of idx.get(key(gx+dx,gy+dy))||[])candidates.add(seg);
   const vx=(b[1]-a[1])*cos,vy=b[0]-a[0],vlen=Math.hypot(vx,vy);
   let winner=null,best=Infinity;
   for(const seg of candidates){
    const sx=seg.bx-seg.ax,sy=seg.by-seg.ay,den=sx*sx+sy*sy;if(!den)continue;
    const t=Math.max(0,Math.min(1,((px-seg.ax)*sx+(py-seg.ay)*sy)/den));
    const d=Math.hypot(px-seg.ax-t*sx,py-seg.ay-t*sy)*111195;
    if(d>24)continue;
    const align=vlen?Math.abs((vx*sx+vy*sy)/(vlen*Math.sqrt(den))):1;
    if(distance>6&&align<.62)continue;
    const score=d+(1-align)*18-(seg.cl.strong?1:0);
    if(score<best){best=score;winner=seg.cl}
   }
   const kind=winner?winner.kind:'unknown',strong=!!(winner&&winner.strong);
   total+=distance;totals[kind]+=distance;if(strong)strongTotals[kind]+=distance;
   const xyA=[a[1],a[0]],xyB=[b[1],b[0]];
   if(runKind!==kind||runStrong!==strong){flush();runKind=kind;runStrong=strong;run=[xyA,xyB]}else run.push(xyB);
  }
  flush();
 }
 return {features:output,totals,strongTotals,total};
}
function refreshSurfaceMap(){
 if(!ready||!map)return;
 const entry=surfaceCache.get(chosen),show=surfaceShown&&chosen>=0&&entry&&entry.features;
 const source=map.getSource('surface-selection');if(source)source.setData(show?{type:'FeatureCollection',features:entry.features}:emptyGeo);
 for(const id of ['surface-shadow','surface-colored'])if(map.getLayer(id))map.setLayoutProperty(id,'visibility',show?'visible':'none');
 for(const id of ['selected-line','selected-shadow'])if(map.getLayer(id))map.setLayoutProperty(id,'visibility',show?'none':'visible');
}
function showSurfaceInfo(i,result){
 if(chosen!==i||!$('surfaceArea'))return;
 const total=result.total||routes[i].km,labels=Object.keys(SURFACE_NAMES);
 const area=$('surfaceArea');area.replaceChildren();
 const head=document.createElement('h3');head.style.margin='15px 0 4px';head.textContent='Wegbeschaffenheit';area.append(head);
 const bar=document.createElement('div');bar.className='surface-bar';bar.title='Anteile entlang der GPS-Strecke';
 for(const k of labels){const value=result.totals[k]||0,el=document.createElement('span');el.style.background=SURFACE_COLORS[k];el.style.width=(100*value/Math.max(.001,total))+'%';bar.append(el)}area.append(bar);
 const rows=document.createElement('div');rows.className='surface-details';
 for(const k of labels){const dist=result.totals[k]||0,one=document.createElement('span');one.innerHTML='<i class="surface-dot" style="background:'+SURFACE_COLORS[k]+'"></i> ';one.append(document.createTextNode(SURFACE_NAMES[k]));const two=document.createElement('span');two.className='distance';two.textContent=fmt(dist)+' km · '+fmt(100*dist/Math.max(.001,total),0)+' %';rows.append(one,two)}
 area.append(rows);
 const toolbar=document.createElement('div');toolbar.className='surface-toolbar';
 const label=document.createElement('label'),toggle=document.createElement('input');toggle.type='checkbox';toggle.checked=surfaceShown;toggle.onchange=()=>{surfaceShown=toggle.checked;refreshSurfaceMap()};label.append(toggle,document.createTextNode('Wegarten farbig auf Karte'));toolbar.append(label);
 const retry=document.createElement('button');retry.textContent='Neu laden';retry.onclick=()=>{surfaceCache.delete(i);loadSurface(i)};toolbar.append(retry);area.append(toolbar);
 const annotation=document.createElement('p');annotation.className='hint';const tagged=Object.values(result.strongTotals).reduce((a,b)=>a+b,0);
 annotation.textContent='Quelle: © OpenStreetMap-Mitwirkende. '+fmt(100*tagged/Math.max(.001,total),0)+' % mit konkretem Oberflächen-Tag; weitere Abschnitte teils nach Wegtyp geschätzt. Unbekannt bleibt unbekannt. OSM-Daten und GPX-Abgleich können abweichen.';area.append(annotation);
 if(!surfaceShown){surfaceShown=true;toggle.checked=true}refreshSurfaceMap();
}
async function loadSurface(i){
 const id=++surfaceRequestId,area=$('surfaceArea');if(!area)return;
 if(surfaceCache.has(i)){showSurfaceInfo(i,surfaceCache.get(i));return}
 const status=$('surfaceStatus');if(status)status.textContent='Gespeicherte Wegdaten werden geladen …';
 try{
   const response=await fetch('surfaces/'+i+'.json',{cache:'force-cache'});
   if(!response.ok)throw Error('Keine vorbereiteten Wegdaten für diese Tour vorhanden');
   const result=await response.json();
   if(id!==surfaceRequestId)return;
   if(!result||!Array.isArray(result.features)||!result.totals)throw Error('Ungültige Wegdaten');
   surfaceCache.set(i,result);showSurfaceInfo(i,result);
 }catch(err){
   if(id!==surfaceRequestId)return;
   console.warn('Vorbereitete Wegdaten:',err);
   const box=$('surfaceArea');if(!box)return;box.replaceChildren();
   const title=document.createElement('h3');title.textContent='Wegbeschaffenheit';box.append(title);
   const p=document.createElement('p');p.className='surface-status';
   p.textContent='Für diese Tour sind noch keine vorberechneten OSM-Wegdaten vorhanden. Die Tour und das Höhenprofil funktionieren weiterhin.';box.append(p);
   const btn=document.createElement('button');btn.className='round';btn.style.width='auto';btn.style.padding='0 12px';btn.textContent='Erneut prüfen';btn.onclick=()=>loadSurface(i);box.append(btn);
 }
}
console.info('WEGARTEN-STATIC-V3 aktiv');
